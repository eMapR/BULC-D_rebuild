# Cell 8C: parameter-matched comparison config, legacy GUI (guiBULCD.rtf)
# vs. this rebuild.
#
# Every value below was either (a) confirmed as a GUI default by reading
# guiBULCD.rtf directly, (b) fetched live from the real study-area grid
# asset, or (c) left as a placeholder you must fill in by hand. See
# CLAUDE.md for the full writeup of how each value was sourced - this
# file doesn't repeat that reasoning, only the conclusions.
#
# Real GUI parameters confirmed by the user (2026-08-10), transcribed
# directly from their actual cell 8C GUI run - not placeholders anymore
# for evidence/modality/sensitivity:
#   Cross-Sensors: LS8, LS9, S2
#   Expectation: year 2024, DOY 74-288, cloud cover threshold 70
#   Target: year 2025, DOY 74-288, cloud cover threshold 70
#   Value to track: NBR
#   (DOY updated 2026-08-10: both expectation and target moved from
#   1-365 to 74-288 - our schema has one first_doy/last_doy per sensor
#   covering the whole continuous evidence stream, no separate
#   expectation-only/target-only DOY field, so this applies uniformly.)
#   Day step size: 3
#   Modality: unimodal only (NOT constant+unimodal - differs from the
#     GUI's own out-of-the-box default found earlier in guiBULCD.rtf;
#     this run explicitly selected only unimodal)
#   Sensitivity: numerator multiplier 1, minimum denominator 0.05
#
# Real values pulled 2026-08-10 from the GUI's own Console output
# (expanded "Arguments to BULC-D" -> BULCargumentDictionaryPlus for the
# actual cell 8C / DOY 74-288 run):
#   custom_transition_matrix: REAL, below - confirmed production values,
#     not Willis (2022)'s thesis placeholder anymore.
#   dampening_factor / posterior_leveler: RESOLVED 2026-08-10. Production
#     doesn't have one dampening factor - it has THREE separate "leveler"
#     parameters plus two "minimum" floors:
#       initializingLeveler: 0.7   transitionLeveler: 0.7
#       posteriorLeveler: 0.9      transitionMinimum: 0.1
#                                  posteriorMinimum: 0.0333...
#     Fetched BULC-Minimal-Module-107's real source (r-2909-BULC-Releases,
#     legacy/BULC-Minimal-Module-107.txt) and confirmed: transitionLeveler
#     maps directly onto bulc.py's existing dampening_factor (dampens the
#     incoming update factors); posteriorLeveler is a SEPARATE step bulc.py
#     didn't implement at all - dampens the posterior after every Bayes
#     update. Implemented as a new posterior_leveler parameter (bulc.py's
#     dampen() reused for both steps). initializingLeveler is still NOT
#     modeled - it governs one-hot-encoding a real baseLandCoverImage into
#     a starting prior, which this rebuild has no equivalent of (starts
#     from flat uniform instead) - a separate, still-open difference.

schema_version: "1"

study_area:
  # Fetched live 2026-08-10 via:
  #   ee.FeatureCollection("projects/eastern-cascades-bugnet/assets/clipped_grid_35000m")
  #     .filter(ee.Filter.eq("grid_id", "8C")).first().geometry().getInfo()
  aoi_coordinates:
    - [-121.73874831706843, 46.41542854445968]
    - [-121.6293453220673, 46.436501951127106]
    - [-121.51987266795737, 46.45748901890104]
    - [-121.41033047131877, 46.47838966176253]
    - [-121.30071909642608, 46.499203880776555]
    - [-121.33065449532106, 46.5753759686925]
    - [-121.36065907221794, 46.65155915180402]
    - [-121.39073322068826, 46.72775365365402]
    - [-121.42087709098942, 46.80395961363527]
    - [-121.53095818658772, 46.78302934523635]
    - [-121.64096911779635, 46.7620122647017]
    - [-121.75090969532377, 46.740908396952065]
    - [-121.86077967620425, 46.71971794748149]
    - [-121.83016615342095, 46.643629289293024]
    - [-121.79962326387309, 46.5675516517619]
    - [-121.76915070345468, 46.49148478087153]
    - [-121.73874831706843, 46.41542854445968]
  crs: "EPSG:4326"
  scale: 30
  forest_mask_asset: null
  mask_water: true       # legacy applies afn_waterMask() unconditionally - keep on both sides
  mask_non_forest: false # legacy has NO forest mask anywhere in guiBULCD.rtf (confirmed by
                         # grep - zero hits for forest/treecover/hansen/canopy). Off here so
                         # this rebuild isn't cleaner-above-treeline than the thing it's being
                         # compared against. Turn back on for real production runs.

evidence:
  day_step_size: 3  # user's GUI run used 3, not the legacy default of 4
  # Expectation = baseline year the GUI treated as "normal": 2024 only.
  # expectation_last_year is EXCLUSIVE (inputs.py builds it as
  # f"{expectation_last_year}-01-01", same convention as sensor
  # last_year) - 2025 here means "through end of 2024", not "includes
  # 2025". Also required to be strictly > first_year by loader.py, so a
  # single-year baseline can't be written as 2024/2024.
  expectation_first_year: 2024
  expectation_last_year: 2025
  # Target year in the GUI was 2025 (single year, DOY 1-365). Our
  # continuous-evidence model doesn't have a separate "target" field -
  # each sensor's evidence window below just needs to EXTEND THROUGH
  # 2025 so that year's images are in the stream. last_year=2026 because
  # _date_bounds()'s end-year is EXCLUSIVE (see CLAUDE.md "Two-layer...").
  # When querying results for "2025 specifically" (interpret.py's
  # zscore_anomaly_mask_for_year() / disturbance_mask_for_year()), pass
  # year=2025 explicitly - it's a query parameter at call time, not here.
  sensors:
    L8:
      enabled: true
      first_year: 2024
      last_year: 2026
      first_doy: 74
      last_doy: 288
      cloud_cover_threshold: 70
    L9:
      enabled: true
      first_year: 2024
      last_year: 2026
      first_doy: 74
      last_doy: 288
      cloud_cover_threshold: 70
    S2:
      enabled: true
      first_year: 2024
      last_year: 2026
      first_doy: 74
      last_doy: 288
      cloud_cover_threshold: 70
      # No s2_cloud_mask config - cloud masking uses Google Cloud Score+
      # (a single hardcoded 0.60 threshold), CONFIRMED 2026-08-10 as
      # production's real, only live S2 cloud-mask path - replaced an
      # earlier, incorrect s2cloudless implementation. See
      # bulcd/inputs.py's _mask_s2_clouds().
    L5:
      enabled: false
    S1:
      enabled: false

reduction:
  band: nbr  # "Value to track: NBR" - matches Willis (2022)'s NBR12 transition matrix

modality:
  # CORRECTED 2026-08-10: the actual confirmed BULCargumentDictionaryPlus
  # Console dump from this exact cell 8C run showed constant:true AND
  # unimodal:true together - `constant: false` here was a transcription
  # error on the assistant's part from an earlier verbal parameter list,
  # not what the real run used. Also required for correctness:
  # afn_determineHarmonicIndependentsViaModalityDictionary's real source
  # (legacy/502.7-1h5-HarmonicFunctions.txt) only initializes its
  # regressor list inside `if (vm.constant)` - constant=false would be
  # a crash in production, not a valid alternate configuration.
  constant: true
  unimodal: true
  linear: false
  bimodal: false
  trimodal: false

sensitivity:
  # User-confirmed actual GUI values (also happen to match the GUI's
  # own out-of-the-box default, guiBULCD.rtf line 5952-5954).
  z_score_numerator_factor: 1
  z_score_denominator_factor: 0.05

bin_cuts: [-2, -1.5, -1, -0.5, 0, 0.5, 1, 1.5, 2]  # confirmed GUI default, guiBULCD.rtf line 5965
harmonic_constant: false
plotting_means: true
verbose: false

bulc_advanced_params:
  # REAL production values, confirmed 2026-08-10 against the actual
  # BULC-Minimal-Module-107 AND 6003.3c-BULC-AdvancedParameters sources
  # (legacy/BULC-Minimal-Module-107.txt) - no longer placeholders, and no
  # longer partial. All three of production's real levelers are now
  # implemented and matched.
  dampening_factor: 0.7  # = production's transitionLeveler
  recency_factor: 1.0  # off - not part of the legacy method at all, keep off for this comparison
  # CONFIRMED against 6003.3c-BULC-AdvancedParameters: production's
  # baseLandCoverImage = ee.Image(2) ("default is 'nothing has changed'")
  # - a hardcoded, run-independent constant, one-hot encoded to
  # "unchanged" and leveled the same way as everything else. Real value:
  # 0.7, giving a starting prior of [0.1, 0.8, 0.1]
  # (decrease/unchanged/increase) - not this rebuild's previous flat
  # [0.333, 0.333, 0.333]. This was the last of the three levelers and
  # the most likely explanation for the remaining "decrease"-dominant vs.
  # GUI's "unchanged"-dominant disagreement after the posterior_leveler
  # fix alone.
  initializing_leveler: 0.7  # = production's initializingLeveler
  # NEW 2026-08-10: production applies a SECOND dampening step to the
  # POSTERIOR after every Bayes update (afn_dayIRebalancingV3), which
  # bulc.py previously didn't implement at all - see
  # docs/decisions/0004-dampening-factor-default-0.5.md's "Open gap" and
  # docs/findings.md "Real production BULC-D parameters". This was very
  # likely the real cause of the extreme, near-total "decrease"
  # classification seen in the first cell 8C render (probabilities
  # differing from 1.0 by 10^-16 to 10^-112) despite near-zero-median
  # z-scores - unbounded compounding over ~350 sequential steps with no
  # per-step regularization on the posterior itself.
  posterior_leveler: 0.9  # = production's posteriorLeveler
  # REAL production values, pulled 2026-08-10 from the GUI's Console
  # (BULCargumentDictionaryPlus.customTransitionMatrix) for cell 8C -
  # NOT Willis (2022)'s thesis placeholder anymore. Rows sum to ~1
  # (real conditional probabilities), unlike the thesis's hand-picked
  # weights. Columns: [P(bin|decrease), P(bin|unchanged), P(bin|increase)].
  custom_transition_matrix:
    - [0.83, 0.08, 0.08]
    - [0.66, 0.24, 0.08]
    - [0.53, 0.37, 0.08]
    - [0.14, 0.76, 0.08]
    - [0.08, 0.83, 0.08]
    - [0.08, 0.83, 0.08]
    - [0.08, 0.76, 0.14]
    - [0.08, 0.37, 0.53]
    - [0.08, 0.24, 0.66]
    - [0.08, 0.08, 0.83]

export:
  destination: asset
  asset_folder: "projects/bulcd-python-rebuild/assets/"
  max_pixels: 1000000000000
  description_prefix: bulcd_cell8c_comparison
