# Example BULC-D parameter file.
#
# Real-world counterpart: legacy/BULCD-InputParameters-v5.txt (a
# BULCD-Caller-Parameters/BULCD-InputParameters-v5 file from the
# `alemlakes/r-2909-BULC-Releases` GEE repo), adapted to one continuous
# per-sensor evidence window instead of the legacy's separate
# expectation-period/target-period dictionaries.
#
# Loaded via bulcd.config.loader.load_config().

schema_version: "1"

study_area:
  # Exactly one of aoi_asset / aoi_coordinates must be set.
  aoi_coordinates: [[-126.04, 49.59], [-126.04, 40.76], [-118.93, 40.76], [-118.93, 49.59]]
  crs: "EPSG:4326"
  scale: 30
  forest_mask_asset: null

evidence:
  day_step_size: 4
  # Global baseline window for the expectation-model fit (see CLAUDE.md
  # "Reference papers" / "Design decision: the expectation baseline
  # window" in the implementation plan) - a deliberate domain choice of
  # which calendar years count as "normal, undisturbed forest", not
  # derived from sensor data availability. Applied to the merged,
  # sensor-agnostic evidence stream regardless of which sensor(s) below
  # contributed images in this range.
  expectation_first_year: 2015
  expectation_last_year: 2017
  sensors:
    L8:
      enabled: true
      first_year: 2013  # Landsat 8 launch year
      last_year: null   # null = through most recent available
      first_doy: 150
      last_doy: 250
      cloud_cover_threshold: 20
    L9:
      enabled: true
      first_year: 2021  # Landsat 9 launch year
      last_year: null
      first_doy: 150
      last_doy: 250
      cloud_cover_threshold: 20
    S2:
      enabled: false
      first_year: 2018
      last_year: null
      first_doy: 1
      last_doy: 365
      cloud_cover_threshold: 70
      s2_cloud_mask:
        cld_prb_thresh: 50
        nir_drk_thresh: 0.15
        cld_prj_dist: 3
        buffer: 50
    S1:
      enabled: false
      first_year: 2015
      last_year: null
      first_doy: 270
      last_doy: 360
      sar_polarization: HV

reduction:
  band: swir

modality:
  # Legacy example has both constant and unimodal true (not mutually
  # exclusive) - read as candidate shapes, not a single selector.
  constant: true
  unimodal: true
  linear: false
  bimodal: false
  trimodal: false

sensitivity:
  z_score_numerator_factor: 1
  z_score_denominator_factor: 0.05

bin_cuts: [-2, -1.5, -1, -0.5, 0, 0.5, 1, 1.5, 2]
harmonic_constant: false
plotting_means: true
verbose: false

# Still a placeholder for BULCD-AdvancedParameters-v5's full, real
# contents, but three fields below are now typed - see CLAUDE.md
# "Reference papers" and bulcd/config/schema.py's BULCAdvancedParams.
bulc_advanced_params:
  dampening_factor: 0.5  # paper's own tested value; d=1.0 (no dampening) was found
                         # to produce extreme overconfidence in a live-EE test run
  # NOT part of the reconstructed classic method (see CLAUDE.md "Recency
  # weighting") - an optional extension, off by default (1.0). Only turn
  # this on if you've read that section and understand the tradeoff;
  # 0.98 fixed one real long-baseline-masking case in testing, but this
  # is not a validated universal default.
  recency_factor: 1.0
  # Willis (2022)'s own worked example for NBR12 (this study's example,
  # NOT a shipped production default - BAI or other reduction bands need
  # a differently-shaped matrix; see the thesis's Figure A4/A5). Reduction
  # band here is "swir" above, not NBR12, so replace this before a real run.
  custom_transition_matrix:
    - [0.16, 0.11, 0.02]    # bin 1  (most extreme drop)
    - [0.14, 0.07, 0.02]    # bin 2
    - [0.07, 0.12, 0.02]    # bin 3
    - [0.03, 0.16, 0.02]    # bin 4
    - [0.015, 0.2, 0.01]    # bin 5
    - [0.015, 0.195, 0.025] # bin 6
    - [0.02, 0.1255, 0.07]  # bin 7
    - [0.02, 0.07, 0.11]    # bin 8
    - [0.02, 0.05, 0.12]    # bin 9
    - [0.02, 0.02, 0.08]    # bin 10 (deliberately down-weighted outlier bin)

export:
  destination: asset
  asset_folder: "users/example-user/example-project:bulcd_outputs/"
  max_pixels: 1000000000000
  description_prefix: bulcd
